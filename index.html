<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5ee" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="An unofficial concept redesign of the start.ng homepage. Every game links to the real start.ng." />
    <title>start.ng · concept redesign</title>
    <script>
      try {
        const t = localStorage.getItem('sng-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
